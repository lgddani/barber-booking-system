spring.application.name=barber-booking-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:barberbooking}
spring.datasource.username=${DB_USER:barberbooking}
spring.datasource.password=${DB_PASSWORD:barberbooking}

# El esquema lo gobierna Flyway (db/migration); Hibernate solo valida que las
# entidades coincidan con las tablas reales, nunca las crea ni las modifica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info

# En un despliegue real, JWT_SECRET debe venir del entorno, nunca del default.
app.jwt.secret=${JWT_SECRET:this-is-a-local-dev-only-secret-key-please-change-me}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
