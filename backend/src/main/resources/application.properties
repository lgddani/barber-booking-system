spring.application.name=barber-booking-api

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:barberbooking}
spring.datasource.username=${DB_USER:barberbooking}
spring.datasource.password=${DB_PASSWORD:barberbooking}

# El esquema lo gobierna Flyway (db/migration); Hibernate solo valida que las
# entidades coincidan con las tablas reales, nunca las crea ni las modifica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
