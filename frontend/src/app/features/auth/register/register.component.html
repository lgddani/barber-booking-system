<main class="min-h-screen flex items-center justify-center px-6">
  <div class="max-w-sm w-full bg-surface border border-line rounded-2xl p-8">
    <h1 class="font-display text-2xl font-semibold text-ink m-0 text-center">Crear cuenta</h1>
    <p class="text-ink-soft text-sm text-center mt-2 mb-8">Regístrate para empezar a reservar</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-5">
      <div class="flex flex-col gap-1.5">
        <label for="fullName" class="text-sm font-medium text-ink">Nombre completo</label>
        <input
          id="fullName"
          formControlName="fullName"
          autocomplete="name"
          class="w-full border rounded-lg px-3.5 py-2.5 text-sm text-ink bg-transparent focus:outline-none focus:ring-2 transition duration-200 ease-out"
          [ngClass]="showError('fullName') ? 'border-error focus:ring-error/20' : 'border-line focus:border-clay focus:ring-clay/20'"
        />
        @if (showError('fullName')) {
          <p class="text-xs text-error m-0">Ingresa tu nombre</p>
        }
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="email" class="text-sm font-medium text-ink">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          class="w-full border rounded-lg px-3.5 py-2.5 text-sm text-ink bg-transparent focus:outline-none focus:ring-2 transition duration-200 ease-out"
          [ngClass]="showError('email') ? 'border-error focus:ring-error/20' : 'border-line focus:border-clay focus:ring-clay/20'"
        />
        @if (showError('email')) {
          <p class="text-xs text-error m-0">Ingresa un email válido</p>
        }
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="phone" class="text-sm font-medium text-ink">Teléfono <span class="text-ink-muted font-normal">(opcional)</span></label>
        <input
          id="phone"
          formControlName="phone"
          autocomplete="tel"
          class="w-full border border-line rounded-lg px-3.5 py-2.5 text-sm text-ink bg-transparent focus:outline-none focus:ring-2 focus:border-clay focus:ring-clay/20 transition duration-200 ease-out"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="password" class="text-sm font-medium text-ink">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          class="w-full border rounded-lg px-3.5 py-2.5 text-sm text-ink bg-transparent focus:outline-none focus:ring-2 transition duration-200 ease-out"
          [ngClass]="showError('password') ? 'border-error focus:ring-error/20' : 'border-line focus:border-clay focus:ring-clay/20'"
        />
        @if (showError('password')) {
          <p class="text-xs text-error m-0">Mínimo 8 caracteres</p>
        }
      </div>

      @if (errorMessage()) {
        <p class="text-sm text-center text-error m-0">{{ errorMessage() }}</p>
      }

      <button mat-flat-button type="submit" [disabled]="loading()" class="w-full">
        @if (loading()) {
          <mat-spinner diameter="20" />
        } @else {
          Crear cuenta
        }
      </button>
    </form>

    <p class="text-sm text-ink-soft text-center mt-6 mb-0">
      ¿Ya tienes cuenta? <a routerLink="/login" class="text-clay font-medium">Inicia sesión</a>
    </p>
  </div>
</main>
