server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El backend nunca lo ve el navegador: la SPA llama a /api/v1/... con URL
    # relativa (mismo origen), y nginx reenvia internamente al contenedor del
    # backend. Esto evita CORS por completo en el stack dockerizado.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback de SPA: cualquier ruta que no sea un archivo real (ej.
    # /cliente/reservar) debe servir index.html para que Angular Router la
    # resuelva del lado del cliente, en vez de que nginx devuelva 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
