services:
  db:
    image: postgres:16-alpine
    container_name: barber-booking-db
    environment:
      POSTGRES_DB: ${DB_NAME:-barberbooking}
      POSTGRES_USER: ${DB_USER:-barberbooking}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-barberbooking}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - barber_booking_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-barberbooking} -d ${DB_NAME:-barberbooking}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: barber-booking-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # db/5432: nombre y puerto del servicio DENTRO de la red de Docker, no
      # tienen relacion con el DB_PORT de host (5433) usado mas arriba.
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-barberbooking}
      DB_USER: ${DB_USER:-barberbooking}
      DB_PASSWORD: ${DB_PASSWORD:-barberbooking}
      JWT_SECRET: ${JWT_SECRET:-this-is-a-local-dev-only-secret-key-please-change-me}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      # Incluye el puerto de "ng serve" (4200, uso normal en desarrollo) y el
      # del frontend dockerizado (8081): aunque nginx haga que el navegador
      # vea todo como "mismo origen", el header Origin que llega al backend
      # sigue siendo el de la página (8081), y Spring Security lo valida
      # igual contra esta lista.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:8081}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-America/Guayaquil}
      SLOT_GRANULARITY_MINUTES: ${SLOT_GRANULARITY_MINUTES:-30}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: barber-booking-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  barber_booking_db_data:
